name: probe
on:
  workflow_dispatch:

jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: runtime env
        run: |
          env | grep -i '^ACTIONS_RUNTIME' | sed 's/=.*/=<set>/' || echo "no runtime env in shell"
      - name: create symlinks and upload
        run: |
          mkdir -p up/dir
          echo "target content" > up/target.txt
          ln -s ../target.txt up/link.txt
          ln -s /tmp up/dirptr
          ls -la up
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: up
  b:
    needs: a
    runs-on: ubuntu-latest
    steps:
      - name: download artifact via API like the composite action
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('dst/artifacts', { recursive: true });
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: context.runId });
            for (const a of arts.filter(a => a.name === 'probe')) {
              const r = await github.rest.actions.downloadArtifact({ ...context.repo, artifact_id: a.id, archive_format: 'zip' });
              fs.writeFileSync(`dst/artifacts/${a.name}.zip`, Buffer.from(r.data));
            }
      - name: unzip like the composite action
        run: |
          unzip -n 'dst/artifacts/*.zip' -d dst
          ls -la dst
          echo '--- symlinks:'
          find dst -type l -exec ls -la {} \; || true
          echo '--- zip entry listing:'
          python3 -c "import zipfile,sys; z=zipfile.ZipFile('dst/artifacts/probe.zip'); print([(i.filename, oct(i.external_attr>>16)) for i in z.infolist()])"
